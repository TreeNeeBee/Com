# ==============================================================================
# LightAP Discovery Server - Environment Configuration
# ==============================================================================
# Source this file to override default Discovery Server settings.
# Used by: lap-discovery-server.service, lap-discovery-monitor.sh
#
# Reference: SERVICE_DISCOVERY_ARCHITECTURE §5.4.1
# ==============================================================================

# Discovery Server listen address (0.0.0.0 = all interfaces)
DS_LISTEN_ADDR=0.0.0.0

# Discovery Server UDP port
DS_PORT=11811

# Discovery Server ID (0-255, must be unique per server in HA setup)
DS_SERVER_ID=0

# Configuration directory
DS_CONFIG_DIR=/etc/lap/discovery

# Health-check interval (seconds)
DS_HEALTH_INTERVAL=5

# Max consecutive failures before fallback to PDP/EDP
DS_MAX_FAILURES=3

# Enable automatic fallback to PDP/EDP mode
DS_FALLBACK_ENABLED=true

# Log level for Discovery Server (error, warning, info)
DS_LOG_LEVEL=warning
